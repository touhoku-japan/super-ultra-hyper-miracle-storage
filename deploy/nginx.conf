# TLS termination in front of suhms (S3 API on 127.0.0.1:9000).
# The admin API ([admin] listen) and the cluster API ([cluster] listen) must NOT be exposed here.

upstream suhms {
    server 127.0.0.1:9000;
    keepalive 64;
}

server {
    listen 443 ssl;
    http2 on;
    # Path-style: s3.sorahost.net/<bucket>/<key>. For virtual-hosted style also list
    # *.s3.sorahost.net (wildcard certificate) and set [s3] domains = ["s3.sorahost.net"].
    server_name s3.sorahost.net;

    ssl_certificate     /etc/letsencrypt/live/s3.sorahost.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s3.sorahost.net/privkey.pem;

    # Objects can be large; suhms enforces its own limits.
    client_max_body_size 0;
    # Stream uploads and downloads instead of buffering them on disk.
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # SigV4 signs the Host header: pass it through unchanged.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # CompleteMultipartUpload of large objects can take minutes (suhms sends keepalive bytes).
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    location / {
        proxy_pass http://suhms;
    }
}

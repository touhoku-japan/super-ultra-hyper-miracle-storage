name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# The jobs only build and test, so the GITHUB_TOKEN needs read access only.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The Web console is embedded into the binary (crates/server/build.rs); build it first so
      # the tests run against the real bundle. SUHMS_REQUIRE_WEB fails the build without it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          SUHMS_REQUIRE_WEB: "1"

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The storage engine's tests (single node and in-process cluster) against the shared
  # metadata backends used in multi-node deployments.
  metadata-backends:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: pw
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: PostgreSQL
        run: cargo test -p suhms-store
        env:
          SUHMS_TEST_POSTGRES: postgres://postgres:pw@127.0.0.1:5432
      - name: MariaDB
        run: cargo test -p suhms-store
        env:
          SUHMS_TEST_MYSQL: mysql://root:pw@127.0.0.1:3306

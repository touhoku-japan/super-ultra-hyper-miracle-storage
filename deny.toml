# cargo-deny: 依存クレートのライセンスと脆弱性のチェック。
# 本プロジェクトは MIT ライセンスのため、互換性のある寛容なライセンスのみ許可する。
# GPL / AGPL / LGPL 等のコピーレフトは許可しない。

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    # Permissive data license of the Mozilla CA bundle (webpki-root-certs, via reqwest's rustls
    # support). No copyleft terms; suhms itself trusts only the cluster CA for node-to-node TLS.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[advisories]
yanked = "deny"
ignore = [
    # chrono is unmaintained (no vulnerability). It only comes in through s3s 0.17 and suhms does
    # not use it directly. Remove this once s3s ships a release without chrono (0.18 is in alpha).
    { id = "RUSTSEC-2026-0543", reason = "unmaintained, not vulnerable; only via s3s 0.17, no release without it yet" },
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

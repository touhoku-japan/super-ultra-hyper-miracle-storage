# cargo-deny: 依存クレートのライセンスと脆弱性のチェック。
# 本プロジェクトは MIT ライセンスのため、互換性のある寛容なライセンスのみ許可する。
# GPL / AGPL / LGPL 等のコピーレフトは許可しない。

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

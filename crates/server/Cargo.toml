[package]
name = "suhms-server"
description = "Super-Ultra-Hyper-Miracle Storage: S3-compatible object storage server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "suhms"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.11.1"
anyhow.workspace = true
async-trait = "0.1.92"
base64 = "0.23.1"
crc-fast = "1.10.0"
bytes = "1.12.1"
futures = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
percent-encoding = "2"
hmac = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
s3s = { version = "0.17.0", default-features = false }
serde_json = "1.0.154"
sha2 = "0.11.1"
suhms-store = { path = "../store" }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tokio-stream = "0.1"
time = "0.3.55"
tower.workspace = true
uuid = { version = "1.29.2", features = ["v4"] }
axum.workspace = true
clap.workspace = true
serde.workspace = true
tokio.workspace = true
toml.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
md-5 = "0.11.0"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
tempfile = "3.27.0"

[lints]
workspace = true
